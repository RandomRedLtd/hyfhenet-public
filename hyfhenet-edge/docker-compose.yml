services:
  gateway:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${HYFHENET_PYTHON_IMAGE:-python:3.12.3-slim-bookworm}
        INSTALL_FHE_DEPS: ${HYFHENET_GATEWAY_INSTALL_FHE_DEPS:-${HYFHENET_INSTALL_FHE_DEPS:-false}}
        INSTALL_BUILD_DEPS: ${HYFHENET_INSTALL_BUILD_DEPS:-false}
        INSTALL_REPORT_DEPS: ${HYFHENET_GATEWAY_INSTALL_REPORT_DEPS:-false}
        INSTALL_EDF_SERVICE_SDK: ${HYFHENET_GATEWAY_INSTALL_EDF_SERVICE_SDK:-${HYFHENET_INSTALL_EDF_SERVICE_SDK:-false}}
        EDF_SERVICE_SDK_PACKAGE: ${HYFHENET_EDF_SERVICE_SDK_PACKAGE:-service-sdk-python}
    image: ${HYFHENET_GATEWAY_IMAGE:-${HYFHENET_IMAGE:-hyfhenet-edge-gateway:latest}}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HYFHENET_ZIGBEE_HOST: ${HYFHENET_ZIGBEE_HOST:-host.docker.internal}
      HYFHENET_ZIGBEE_PORT: ${HYFHENET_ZIGBEE_PORT:-1883}
      HYFHENET_ZIGBEE_TOPIC: ${HYFHENET_ZIGBEE_TOPIC:-zigbee2mqtt/#}
      HYFHENET_ZIGBEE_TOPIC_PREFIX: ${HYFHENET_ZIGBEE_TOPIC_PREFIX:-zigbee2mqtt/}
      HYFHENET_ZIGBEE_CLIENT_ID: ${HYFHENET_ZIGBEE_CLIENT_ID:-hyfhenet-edge-gateway}
      HYFHENET_ZIGBEE_USERNAME: ${HYFHENET_ZIGBEE_USERNAME:-}
      HYFHENET_ZIGBEE_PASSWORD: ${HYFHENET_ZIGBEE_PASSWORD:-}
      HYFHENET_ZIGBEE_TLS: ${HYFHENET_ZIGBEE_TLS:-false}
      HYFHENET_ZIGBEE_CA_CERT: ${HYFHENET_ZIGBEE_CA_CERT:-}
      HYFHENET_ZIGBEE_CLIENT_CERT: ${HYFHENET_ZIGBEE_CLIENT_CERT:-}
      HYFHENET_ZIGBEE_CLIENT_KEY: ${HYFHENET_ZIGBEE_CLIENT_KEY:-}
      HYFHENET_ZIGBEE_TLS_INSECURE: ${HYFHENET_ZIGBEE_TLS_INSECURE:-false}
      DATALOGGER_GATEWAY_URL: ${DATALOGGER_GATEWAY_URL:-}
      DATALOGGER_GATEWAY_TOKEN: ${DATALOGGER_GATEWAY_TOKEN:-}
      HYFHENET_EDF_SDK_STREAMS: ${HYFHENET_EDF_SDK_STREAMS:-TEMPERATURE,POWER,APPARENT_POWER,METER_INDEXES}
      HYFHENET_EDF_SDK_LISTEN_SECONDS: ${HYFHENET_EDF_SDK_LISTEN_SECONDS:-600}
      HYFHENET_EDF_SDK_DEFAULT_DEVICE_ID: ${HYFHENET_EDF_SDK_DEFAULT_DEVICE_ID:-edf_virtual_datalogger}
      HYFHENET_EDF_SDK_DEFAULT_DEVICE_ROLE: ${HYFHENET_EDF_SDK_DEFAULT_DEVICE_ROLE:-smart_plug}
      HYFHENET_EDF_SDK_REGISTER_UNKNOWN_DEVICES: ${HYFHENET_EDF_SDK_REGISTER_UNKNOWN_DEVICES:-true}
      HYFHENET_EDF_SDK_INCLUDE_UNSUPPORTED_FIELDS: ${HYFHENET_EDF_SDK_INCLUDE_UNSUPPORTED_FIELDS:-false}
      HYFHENET_EDF_SDK_STREAM_FIELD_MAP: ${HYFHENET_EDF_SDK_STREAM_FIELD_MAP:-}
      HYFHENET_FHE_API_URL: ${HYFHENET_FHE_API_URL:-${FHE_URL:-}}
      HYFHENET_FHE_API_KEY: ${HYFHENET_FHE_API_KEY:-${FHE_API:-}}
      HYFHENET_FHE_CACHE_DIR: /app/.cache/hyfhenet
      HYFHENET_FHE_CLIENT_CERT: ${HYFHENET_FHE_CLIENT_CERT:-}
      HYFHENET_FHE_CLIENT_KEY: ${HYFHENET_FHE_CLIENT_KEY:-}
      HYFHENET_FHE_CA_BUNDLE: ${HYFHENET_FHE_CA_BUNDLE:-}
      HYFHENET_FHE_ARCHITECTURE: ${HYFHENET_FHE_ARCHITECTURE:-}
      HYFHENET_FHE_ALLOW_INSECURE_HTTP: ${HYFHENET_FHE_ALLOW_INSECURE_HTTP:-false}
      HYFHENET_FHE_SAMPLE_INTERVAL_SECONDS: ${HYFHENET_FHE_SAMPLE_INTERVAL_SECONDS:-}
      HYFHENET_FHE_ASYNC: ${HYFHENET_FHE_ASYNC:-false}
      HYFHENET_FHE_MAX_PENDING_REQUESTS: ${HYFHENET_FHE_MAX_PENDING_REQUESTS:-1}
      HYFHENET_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS: ${HYFHENET_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS:-0}
      HYFHENET_FHE_TASKS: ${HYFHENET_FHE_TASKS:-}
      HYFHENET_CONTAINERIZED: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - hyfhenet-fhe-cache:/app/.cache/hyfhenet
    command:
      - mqtt-live
      - --output
      - artifacts/gateway_mqtt_live
      - --continuous
      - --log-level
      - progress

  capture:
    profiles: ["capture"]
    build:
      context: .
      args:
        PYTHON_IMAGE: ${HYFHENET_PYTHON_IMAGE:-python:3.12.3-slim-bookworm}
        INSTALL_FHE_DEPS: ${HYFHENET_CAPTURE_INSTALL_FHE_DEPS:-${HYFHENET_INSTALL_FHE_DEPS:-false}}
        INSTALL_BUILD_DEPS: ${HYFHENET_INSTALL_BUILD_DEPS:-false}
        INSTALL_REPORT_DEPS: ${HYFHENET_CAPTURE_INSTALL_REPORT_DEPS:-false}
    image: ${HYFHENET_CAPTURE_IMAGE:-${HYFHENET_IMAGE:-hyfhenet-edge-capture:latest}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HYFHENET_ZIGBEE_HOST: ${HYFHENET_ZIGBEE_HOST:-host.docker.internal}
      HYFHENET_ZIGBEE_PORT: ${HYFHENET_ZIGBEE_PORT:-1883}
      HYFHENET_ZIGBEE_TOPIC: ${HYFHENET_ZIGBEE_TOPIC:-zigbee2mqtt/#}
      HYFHENET_ZIGBEE_TOPIC_PREFIX: ${HYFHENET_ZIGBEE_TOPIC_PREFIX:-zigbee2mqtt/}
      HYFHENET_ZIGBEE_LISTEN_SECONDS: ${HYFHENET_ZIGBEE_LISTEN_SECONDS:-600}
      HYFHENET_ZIGBEE_CLIENT_ID: ${HYFHENET_CAPTURE_CLIENT_ID:-hyfhenet-edge-capture}
      HYFHENET_ZIGBEE_USERNAME: ${HYFHENET_ZIGBEE_USERNAME:-}
      HYFHENET_ZIGBEE_PASSWORD: ${HYFHENET_ZIGBEE_PASSWORD:-}
      HYFHENET_ZIGBEE_TLS: ${HYFHENET_ZIGBEE_TLS:-false}
      HYFHENET_ZIGBEE_CA_CERT: ${HYFHENET_ZIGBEE_CA_CERT:-}
      HYFHENET_ZIGBEE_CLIENT_CERT: ${HYFHENET_ZIGBEE_CLIENT_CERT:-}
      HYFHENET_ZIGBEE_CLIENT_KEY: ${HYFHENET_ZIGBEE_CLIENT_KEY:-}
      HYFHENET_ZIGBEE_TLS_INSECURE: ${HYFHENET_ZIGBEE_TLS_INSECURE:-false}
      HYFHENET_FHE_API_URL: ${HYFHENET_FHE_API_URL:-${FHE_URL:-}}
      HYFHENET_FHE_API_KEY: ${HYFHENET_FHE_API_KEY:-${FHE_API:-}}
      HYFHENET_FHE_CACHE_DIR: /app/.cache/hyfhenet
      HYFHENET_FHE_CLIENT_CERT: ${HYFHENET_FHE_CLIENT_CERT:-}
      HYFHENET_FHE_CLIENT_KEY: ${HYFHENET_FHE_CLIENT_KEY:-}
      HYFHENET_FHE_CA_BUNDLE: ${HYFHENET_FHE_CA_BUNDLE:-}
      HYFHENET_FHE_ARCHITECTURE: ${HYFHENET_FHE_ARCHITECTURE:-}
      HYFHENET_FHE_ALLOW_INSECURE_HTTP: ${HYFHENET_FHE_ALLOW_INSECURE_HTTP:-false}
      HYFHENET_FHE_SAMPLE_INTERVAL_SECONDS: ${HYFHENET_FHE_SAMPLE_INTERVAL_SECONDS:-}
      HYFHENET_FHE_ASYNC: ${HYFHENET_FHE_ASYNC:-false}
      HYFHENET_FHE_MAX_PENDING_REQUESTS: ${HYFHENET_FHE_MAX_PENDING_REQUESTS:-1}
      HYFHENET_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS: ${HYFHENET_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS:-0}
      HYFHENET_FHE_TASKS: ${HYFHENET_FHE_TASKS:-}
      HYFHENET_CONTAINERIZED: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - hyfhenet-fhe-cache:/app/.cache/hyfhenet
    command:
      - mqtt-capture
      - --capture-output
      - ${HYFHENET_CAPTURE_OUTPUT:-artifacts/zigbee_mqtt_capture.csv}
      - --output
      - ${HYFHENET_CAPTURE_RUN_OUTPUT:-artifacts/gateway_mqtt_capture}
      - --run-pipeline
      - --log-level
      - progress

  report:
    profiles: ["report"]
    build:
      context: .
      args:
        PYTHON_IMAGE: ${HYFHENET_PYTHON_IMAGE:-python:3.12.3-slim-bookworm}
        INSTALL_FHE_DEPS: ${HYFHENET_REPORT_INSTALL_FHE_DEPS:-${HYFHENET_INSTALL_FHE_DEPS:-false}}
        INSTALL_BUILD_DEPS: ${HYFHENET_INSTALL_BUILD_DEPS:-false}
        INSTALL_REPORT_DEPS: ${HYFHENET_REPORT_INSTALL_REPORT_DEPS:-true}
    image: ${HYFHENET_REPORT_IMAGE:-${HYFHENET_IMAGE:-hyfhenet-edge-report:latest}}
    environment:
      HYFHENET_FHE_API_URL: ${HYFHENET_FHE_API_URL:-${FHE_URL:-}}
      HYFHENET_FHE_API_KEY: ${HYFHENET_FHE_API_KEY:-${FHE_API:-}}
      HYFHENET_FHE_CACHE_DIR: /app/.cache/hyfhenet
      HYFHENET_FHE_CLIENT_CERT: ${HYFHENET_FHE_CLIENT_CERT:-}
      HYFHENET_FHE_CLIENT_KEY: ${HYFHENET_FHE_CLIENT_KEY:-}
      HYFHENET_FHE_CA_BUNDLE: ${HYFHENET_FHE_CA_BUNDLE:-}
      HYFHENET_FHE_ARCHITECTURE: ${HYFHENET_FHE_ARCHITECTURE:-}
      HYFHENET_FHE_ALLOW_INSECURE_HTTP: ${HYFHENET_FHE_ALLOW_INSECURE_HTTP:-false}
      HYFHENET_FHE_SAMPLE_INTERVAL_SECONDS:
      HYFHENET_FHE_ASYNC: ${HYFHENET_REPORT_FHE_ASYNC:-false}
      HYFHENET_FHE_MAX_PENDING_REQUESTS: ${HYFHENET_REPORT_FHE_MAX_PENDING_REQUESTS:-1}
      HYFHENET_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS: ${HYFHENET_REPORT_FHE_ASYNC_DRAIN_TIMEOUT_SECONDS:-0}
      HYFHENET_FHE_TASKS: ${HYFHENET_REPORT_FHE_TASKS:-}
      HYFHENET_REPORT_VIDEOS: ${HYFHENET_REPORT_VIDEOS:-true}
      HYFHENET_REPORT_SKIP_TRAINING: ${HYFHENET_REPORT_SKIP_TRAINING:-false}
      HYFHENET_REPORT_EDGE_MODEL_PATH: ${HYFHENET_REPORT_EDGE_MODEL_PATH:-}
      HYFHENET_REPORT_BENCHMARK_RUNS: ${HYFHENET_REPORT_BENCHMARK_RUNS:-0}
      HYFHENET_REPORT_FHE_SAMPLE_INTERVAL_SECONDS: ${HYFHENET_REPORT_FHE_SAMPLE_INTERVAL_SECONDS:-}
      HYFHENET_REPORT_FHE_TASKS: ${HYFHENET_REPORT_FHE_TASKS:-}
      HYFHENET_REPORT_REUSE_FHE_REPORT: ${HYFHENET_REPORT_REUSE_FHE_REPORT:-}
      HYFHENET_CONTAINERIZED: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - hyfhenet-fhe-cache:/app/.cache/hyfhenet
    command:
      - prepare-edge-report
      - --source
      - ${HYFHENET_REPORT_SOURCE:-input}
      - --input
      - ${HYFHENET_REPORT_INPUT:-data/zigbee_mqtt_capture.csv}
      - --config
      - ${HYFHENET_REPORT_CONFIG:-configs/pilot_1_2_edge.json}
      - --output
      - ${HYFHENET_REPORT_OUTPUT:-artifacts/edge_report}
      - --interval-seconds
      - ${HYFHENET_REPORT_INTERVAL_SECONDS:-5}

volumes:
  hyfhenet-fhe-cache:
